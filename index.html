<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk | GudangCemilan</title>

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/index.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="login-container mx-3">
        <div class="brand-logo text-dark">
            Gudang<span class="text-primary">Cemilan.</span>
        </div>

        <ul class="nav nav-pills nav-justified nav-pills-custom" id="loginTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="user-tab" data-bs-toggle="tab" data-bs-target="#user-login"
                    type="button" role="tab">
                    <i class="bi bi-person me-2"></i>Pelanggan
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin-login" type="button"
                    role="tab">
                    <i class="bi bi-shield-lock me-2"></i>Admin
                </button>
            </li>
        </ul>

        <div class="tab-content" id="loginTabContent">

            <div class="tab-pane fade show active" id="user-login" role="tabpanel">
                <div class="text-center mb-4">
                    <h5 class="fw-bold mb-1">Selamat Datang Kembali</h5>
                    <p class="text-muted small">Silakan masuk untuk mulai memesan jajanan</p>
                </div>
                <form>
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Email</label>
                        <input type="email" class="form-control" placeholder="Username atau Email" required>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label class="form-label small fw-medium text-secondary">Password</label>
                            <a href="#" class="text-decoration-none small text-muted btn-lupa-password">Lupa Password?</a>
                        </div>
                        <input type="password" class="form-control" placeholder="•••" required>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="rememberUser">
                        <label class="form-check-label small text-secondary" for="rememberUser">
                            Ingat saya di perangkat ini
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-login w-100 shadow-sm mb-3">Masuk Sebagai Pelanggan</button>
                </form>
                <div class="text-center mt-4">
                    <p class="small text-secondary mb-0">Belum punya akun? 
                        <a href="#" data-bs-toggle="modal" data-bs-target="#modalDaftar" class="text-decoration-none text-primary fw-medium id-btn-daftar">Daftar Sekarang</a>
                    </p>
                </div>
            </div>

            <div class="tab-pane fade" id="admin-login" role="tabpanel">
                <div class="text-center mb-4">
                    <h5 class="fw-bold mb-1">Admin Portal</h5>
                    <p class="text-muted small">Area khusus manajemen dan pengelolaan toko</p>
                </div>
                <form>
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Username / ID Admin</label>
                        <input type="text" class="form-control" placeholder="Username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Password Keamanan</label>
                        <input type="password" class="form-control" placeholder="•••" required>
                    </div>
                    <button type="submit" class="btn btn-dark btn-login w-100 shadow-sm">Masuk Dashboard</button>
                </form>
            </div>

        </div>
    </div>

    <div class="modal fade" id="modalDaftar" tabindex="-1" aria-labelledby="modalDaftarLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 py-3">
                    <h5 class="modal-title fw-bold text-dark" id="modalDaftarLabel">
                        <i class="bi bi-person-plus-fill text-primary me-2"></i>Gabung GudangCemilan
                    </h5>
                    <button type="button" class="btn-close" data-bs-shadow="none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body px-4 pb-4">
                    <p class="text-muted small mb-4">Buat akun Anda sekarang untuk mendapatkan promo diskon ongkir jajanan Bandung!</p>
                    <form id="formPendaftaran">
                        <div class="mb-3">
                            <label class="form-label small fw-medium text-secondary">Nama Lengkap</label>
                            <input type="text" id="regNama" class="form-control" placeholder="Masukkan nama lengkap Anda" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-medium text-secondary">Alamat Email</label>
                            <input type="email" id="regEmail" class="form-control" placeholder="contoh@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-medium text-secondary">Password Baru (Minimal 6 karakter)</label>
                            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" minlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-3 fw-bold shadow-sm mt-2">Buat Akun Sekarang</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
